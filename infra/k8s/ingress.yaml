apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-ingress
  namespace: future-platforms
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  rules:
    - host: api.platforms.internal
      http:
        paths:
          - path: /api/v1/agentguard
            pathType: Prefix
            backend:
              service:
                name: agentguard-backend
                port:
                  number: 8081
          - path: /api/v1/griddispatch
            pathType: Prefix
            backend:
              service:
                name: griddispatch-backend
                port:
                  number: 8082
