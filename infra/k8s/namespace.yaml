apiVersion: v1
kind: Namespace
metadata:
  name: future-platforms
  labels:
    environment: production
    managed-by: argocd
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: future-platforms
data:
  SPRING_PROFILES_ACTIVE: "k8s,production"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.future-platforms.svc.cluster.local:9092"
  REDIS_HOST: "redis.future-platforms.svc.cluster.local"
  REDIS_PORT: "6379"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.future-platforms.svc.cluster.local:4318"
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: future-platforms
type: Opaque
stringData:
  AGENTGUARD_DB_PASSWORD: "production_vault_password_ag"
  GRIDDISPATCH_DB_PASSWORD: "production_vault_password_gd"
  REDIS_PASSWORD: "production_vault_redis_password"
  JWT_SECRET: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
